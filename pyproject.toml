[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bidalert"
version = "0.2.0"
description = "Government tender screening pipeline: polite ingestion, dedup, eligibility filters, explainable scoring, API, dashboard and alerts."
readme = "README.md"
license = "MIT"
authors = [{ name = "Aman Arora" }]
requires-python = ">=3.11"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Framework :: FastAPI",
]
# Ranges here; exact, tested pins live in requirements.txt / requirements-dev.txt.
dependencies = [
    "alembic>=1.13,<2",
    "beautifulsoup4>=4.12,<5",
    "fastapi>=0.115,<1",
    "httpx>=0.27,<1",
    "jinja2>=3.1,<4",
    "openpyxl>=3.1,<4",
    "prometheus-client>=0.20,<1",
    "pydantic>=2.7,<3",
    "sqlalchemy>=2.0.30,<2.2",
    "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.2,<4"]

[project.scripts]
bidalert = "bidalert.cli:main"

[project.urls]
Homepage = "https://github.com/Worldisbinary/bid-alert-tender-pipeline"
Dashboard = "https://worldisbinary.github.io/bid-alert-tender-pipeline/"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
bidalert = [
    "py.typed",
    "default_profile.toml",
    "templates/*.j2",
    "migrations/*.py",
    "migrations/script.py.mako",
    "migrations/versions/*.py",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "postgres: needs a PostgreSQL server (set BIDALERT_TEST_POSTGRES_URL)",
    "network: hits a real website; skipped unless BIDALERT_TEST_NETWORK=1",
]
filterwarnings = [
    "error::DeprecationWarning:bidalert.*",
    "ignore:Using `httpx` with `starlette.testclient` is deprecated",
]

[tool.coverage.run]
source = ["bidalert"]
branch = true
omit = ["*/migrations/*"]

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError", "if __name__ == .__main__.:"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "S", "RUF", "C4", "PTH", "DTZ"]
ignore = [
    "S101",   # assert is fine in tests and for invariants
    "S311",   # random is used for jitter and synthetic data, not crypto
    "RUF001", "RUF002", "RUF003",  # rupee sign and dashes in strings/comments are intentional
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S108", "DTZ001", "PTH"]
"src/bidalert/migrations/**" = ["E501"]

[tool.bandit]
exclude_dirs = ["tests"]
# B311: `random` drives backoff jitter, MinHash parameters and synthetic data; none is security-sensitive.
skips = ["B311"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
files = ["src/bidalert"]
exclude = ["src/bidalert/migrations/"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["openpyxl.*", "bs4.*"]
ignore_missing_imports = true

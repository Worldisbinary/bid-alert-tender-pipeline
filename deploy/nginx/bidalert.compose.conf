# nginx in docker-compose: static dashboard at /, FastAPI behind /api/.
# deploy/ansible/templates/nginx-bidalert.conf.j2 renders the same layout for a bare host.

upstream bidalert_api {
    server api:8000;
    keepalive 16;
}

# 10 requests/second per client IP with a small burst: enough for people, not for scrapers.
limit_req_zone $binary_remote_addr zone=bidalert_api:10m rate=10r/s;

server {
    listen 80;
    server_name _;
    server_tokens off;
    client_max_body_size 1m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; img-src 'self' data: https://fastapi.tiangolo.com; frame-ancestors 'none'" always;

    gzip on;
    gzip_types text/css application/json application/javascript text/plain;

    location = /healthz {
        access_log off;
        proxy_pass http://bidalert_api/health;
    }

    # Prometheus metrics are for the internal network only.
    location = /api/metrics {
        return 404;
    }

    location /api/ {
        limit_req zone=bidalert_api burst=20 nodelay;
        limit_req_status 429;
        proxy_pass http://bidalert_api/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }

    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ =404;
        expires 5m;
    }
}

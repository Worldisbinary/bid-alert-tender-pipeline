name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  FORCE_COLOR: "1"

jobs:
  lint:
    name: Lint and type-check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt && pip install --no-deps -e .
      - run: ruff check --output-format=github src tests
      - run: ruff format --check src tests
      - run: mypy

  test:
    name: Tests (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: bidalert
          POSTGRES_PASSWORD: bidalert-ci-only
          POSTGRES_DB: bidalert
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U bidalert"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      BIDALERT_TEST_POSTGRES_URL: postgresql+psycopg://bidalert:bidalert-ci-only@localhost:5432/bidalert
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt && pip install --no-deps -e .
      - name: pytest (SQLite + PostgreSQL)
        run: pytest --cov --cov-report=term --cov-report=xml --cov-fail-under=90 -rs
      - name: Coverage summary
        if: matrix.python == '3.12'
        run: |
          python - <<'EOF' >> "$GITHUB_STEP_SUMMARY"
          import xml.etree.ElementTree as ET
          root = ET.parse("coverage.xml").getroot()
          print(f"### Coverage: {float(root.get('line-rate')) * 100:.1f}% lines, "
                f"{float(root.get('branch-rate')) * 100:.1f}% branches")
          EOF
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: matrix.python == '3.12'
        with:
          name: coverage-xml
          path: coverage.xml
          retention-days: 14

  docker:
    name: Docker build, scan and compose smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: bidalert:local
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Image runs as non-root and the CLI works
        run: |
          test "$(docker run --rm --entrypoint id bidalert:local -u)" = "10001"
          docker run --rm bidalert:local bidalert --version
          docker image ls bidalert:local --format 'Image size: {{.Size}}' | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Trivy vulnerability scan (fixable HIGH/CRITICAL fail the build)
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:0.74.0 image --scanners vuln --ignore-unfixed \
            --severity HIGH,CRITICAL --exit-code 1 --no-progress bidalert:local
      - name: docker compose up (postgres + migrate + api + worker + nginx)
        env:
          BIDALERT_SOURCES: synthetic
          BIDALERT_WORKER_INTERVAL: "3600"
        run: docker compose up -d --wait --wait-timeout 180
      - name: Smoke test through nginx
        run: |
          set -euo pipefail
          curl -fsS http://localhost:8080/healthz
          curl -fsS http://localhost:8080/api/ready
          for i in $(seq 1 30); do
            total=$(curl -fsS "http://localhost:8080/api/tenders?page_size=1" | jq .total)
            [ "$total" -gt 0 ] && break; sleep 2
          done
          echo "tenders via API: $total"; test "$total" -gt 0
          curl -fsS http://localhost:8080/api/tenders/1/score | jq -e '.factors | length == 5'
          curl -fsS http://localhost:8080/ | grep -q "Demo data, not real tenders"
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/api/metrics)" = "404"
          curl -fsS http://localhost:8080/api/docs | grep -q swagger
          docker compose exec -T api python -c "import urllib.request as u; b = u.urlopen('http://127.0.0.1:8000/metrics').read().decode(); assert 'bidalert_tenders' in b; print('internal /metrics ok')"
          docker compose exec -T postgres psql -U bidalert -d bidalert -c "select status, stats->>'fetched' as fetched from pipeline_runs"
      - name: Compose logs
        if: always()
        run: docker compose logs --no-color | tail -n 200
      - name: Tear down
        if: always()
        run: docker compose down -v

  deploy-config:
    name: Validate Ansible, systemd, nginx and Jenkinsfile
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Ansible syntax check and ansible-lint (production profile)
        working-directory: deploy/ansible
        run: |
          pip install ansible-core==2.20.10 ansible-lint==26.9.0
          ansible-playbook -i inventory.example.ini site.yml --syntax-check
          ansible-lint --profile production site.yml
      - name: systemd-analyze verify
        run: |
          sudo useradd --system bidalert || true
          sudo install -d /opt/bidalert/venv/bin /etc/bidalert /var/lib/bidalert /srv/bidalert
          printf '#!/bin/sh\n' | sudo tee /opt/bidalert/venv/bin/bidalert >/dev/null
          sudo chmod +x /opt/bidalert/venv/bin/bidalert
          sudo touch /etc/bidalert/bidalert.env
          systemd-analyze verify deploy/systemd/*.service deploy/systemd/*.timer
      - name: nginx -t on both configs
        run: |
          pip install jinja2
          python -c "import jinja2,sys; t=jinja2.Template(open('deploy/ansible/templates/nginx-bidalert.conf.j2').read()); open('/tmp/host.conf','w').write(t.render(bidalert_server_name='example.org'))"
          docker run --rm -v /tmp/host.conf:/etc/nginx/conf.d/default.conf:ro nginx:1.28-alpine nginx -t
          docker run --rm --add-host api:127.0.0.1 \
            -v "$PWD/deploy/nginx/bidalert.compose.conf:/etc/nginx/conf.d/default.conf:ro" \
            nginx:1.28-alpine nginx -t
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - name: Jenkinsfile lint (npm-groovy-lint, errors fail)
        run: npx --yes npm-groovy-lint@18.0.0 --failon error --no-insight Jenkinsfile

  security:
    name: Security scans
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: pip-audit (known vulnerabilities in pinned dependencies)
        run: pip install pip-audit==2.10.1 && pip-audit -r requirements.txt
      - name: bandit (Python security lint)
        run: pip install bandit==1.9.4 && bandit -q -r src -c pyproject.toml
      - name: gitleaks (secrets in git history)
        run: |
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.30.1 \
            git /repo --redact --verbose --exit-code 1
